services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop
      POSTGRES_DB: workshop
    ports:
      - "5433:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d workshop"]
      interval: 3s
      timeout: 3s
      retries: 20

  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      DATABASE_URL: postgres://workshop:workshop@db:5432/workshop
      PORT: "3001"
    ports:
      - "3011:3001"
    volumes:
      - ./:/workspace
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install --no-audit --no-fund && node server.js"
